project:
  name: "FraudGuard"
  title: "Cross-Dataset Financial Fraud Detection and Risk Analytics Using Apache Spark and Machine Learning"
  course: "CSET371 — Big Data Analytics and Business Intelligence"
  institution: "Bennett University, Greater Noida"
  version: "1.0.0"
  random_seed: 42

spark:
  app_name: "FraudGuard-SparkML"
  master: "local[*]"
  driver_memory: "4g"
  executor_memory: "4g"
  log_level: "WARN"
  sql_shuffle_partitions: 8

datasets:
  dataset_a:
    name: "IEEE-CIS Fraud Detection"
    type: "Real-world (Vesta / IEEE-CIS Kaggle)"
    raw_dir: "data/raw/ieee_cis"
    transaction_file: "train_transaction.csv"
    identity_file: "train_identity.csv"
    join_key: "TransactionID"
    target_column: "isFraud"
    interim_path: "data/interim/ieee_cis_joined.parquet"
    processed_path: "data/processed/ieee_cis_processed.parquet"
    time_column: "TransactionDT"
    split_strategy: "time_aware" # Can be 'time_aware' or 'random'
    train_ratio: 0.70
    val_ratio: 0.15
    test_ratio: 0.15

  dataset_b:
    name: "Dataset B (Pending User Approval)"
    candidate_status: "Pending User Approval - Candidates Under Review"
    selected_candidate: null
    type: "TBD"
    raw_dir: "data/raw/dataset_b"
    transaction_file: null
    target_column: null
    interim_path: "data/interim/dataset_b_clean.parquet"
    processed_path: "data/processed/dataset_b_processed.parquet"
    time_column: null
    split_strategy: "stratified_random"
    train_ratio: 0.70
    val_ratio: 0.15
    test_ratio: 0.15

dev_mode:
  sample_fraction: 0.05 # For fast smoke testing and debugging
  enabled: true

models:
  logistic_regression:
    max_iter: 100
    reg_param: 0.01
    elastic_net_param: 0.0
  decision_tree:
    max_depth: 6
    max_bins: 32
  random_forest:
    num_trees: 50
    max_depth: 8
    max_bins: 32
  gbt:
    max_iter: 40
    max_depth: 5
    step_size: 0.1
  linear_svc:
    max_iter: 100
    reg_param: 0.01

risk_analysis:
  threshold_min: 0.05
  threshold_max: 0.95
  threshold_step: 0.05

outputs:
  metrics_dir: "outputs/metrics"
  figures_dir: "outputs/figures"
  summaries_dir: "outputs/summaries"
  logs_dir: "outputs/logs"
  powerbi_dir: "powerbi/data"
